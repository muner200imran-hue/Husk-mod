name: Build Husk IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config python3 xcodegen qemu-img
          rustup target add aarch64-apple-ios

      - name: Build IPA
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh build/Husk.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA
          path: |
            build/Husk.ipa
            build/*.tipa
